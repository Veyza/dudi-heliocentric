[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dudi-hc-python-interface"
version = "0.1.0"
description = "Optional Python interface for DUDI-heliocentric"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[tool.setuptools]
# We’re not using src/ layout; package lives under ./python_interface
packages = ["python_interface"]

