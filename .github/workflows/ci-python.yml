name: CI (Python wrapper)

on:
  push:
    branches: [ main ]
    paths:
      - "python_interface/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/ci-python.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "python_interface/**"
      - "pyproject.toml"
      - "MANIFEST.in"
      - ".github/workflows/ci-python.yml"

concurrency:
  group: ci-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system deps (gfortran + OpenMP)
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran libgomp1

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ matrix.python-version }}-

      - name: Install Python deps (build + test)
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest build

      - name: Build Fortran ctypes bridge
        run: bash python_interface/fortran_bridge/build_ctypes_bridge.sh

      - name: Install package (editable)
        run: pip install -e .

      - name: Run tests
        run: python -m pytest -q

